<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coventry Menu Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a sticky cost bar on top, then one working tab at a time; each day is a row of three pick-one cards per meal. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --ink:#16211c; --muted:#5b6a63; --line:#d6dfda;
  --accent:#1c6a4d; --accent-soft:#e2f0ea; --on-accent:#ffffff;
  --sale:#8a5200; --sale-soft:#fdf0d5; --good:#1c6a4d; --good-soft:#e2f0ea; --warn:#8a5200; --warn-soft:#fdf0d5; --bad:#a3302a; --bad-soft:#fbe5e3;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif; --body:"Public Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111815; --surface:#19231f; --ink:#e8efeb; --muted:#9bada4; --line:#2e3c36;
  --accent:#6fcfa6; --accent-soft:#1d3a2f; --on-accent:#0d1a14;
  --sale:#f0bf6a; --sale-soft:#3a2d12; --good:#6fcfa6; --good-soft:#1d3a2f; --warn:#f0bf6a; --warn-soft:#3a2d12; --bad:#f09088; --bad-soft:#40201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111815; --surface:#19231f; --ink:#e8efeb; --muted:#9bada4; --line:#2e3c36;
  --accent:#6fcfa6; --accent-soft:#1d3a2f; --on-accent:#0d1a14;
  --sale:#f0bf6a; --sale-soft:#3a2d12; --good:#6fcfa6; --good-soft:#1d3a2f; --warn:#f0bf6a; --warn-soft:#3a2d12; --bad:#f09088; --bad-soft:#40201d; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding:0 16px 64px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:30px}h2{font-size:22px;margin:28px 0 10px}h3{font-size:18px}h4{margin:0 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
a{color:var(--accent)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mut{color:var(--muted);font-weight:400}
.num,.v,.opt-price{font-variant-numeric:tabular-nums}
.top{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between;padding-top:24px}
.top p{margin:4px 0 0;color:var(--muted)}
.fresh{font-size:14px;color:var(--muted)}
.alert{background:var(--sale-soft);border:1px solid var(--sale);border-radius:10px;padding:12px 16px;font-size:15px}
.alert button{margin-left:6px;background:none;border:0;padding:0;color:var(--sale);font-weight:700;text-decoration:underline}
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;box-shadow:0 4px 14px rgba(0,0,0,.06)}
#sum{display:flex;flex-wrap:wrap;gap:8px 28px}
#sum div{display:flex;flex-direction:column}
.k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.v{font-family:var(--display);font-size:24px;font-weight:700}
.sizes{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sizes span{font-size:14px;color:var(--muted)}
#sizes{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
#sizes button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;border-right:1px solid var(--line)}
#sizes button:last-child{border-right:0}
#sizes button.on{background:var(--accent);color:var(--on-accent)}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
nav button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
.day header{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center}
.day-sum{display:flex;gap:12px;align-items:center;font-size:15px;flex-wrap:wrap}
.meal{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start}
.meal-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding-top:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt.on{background:var(--accent-soft);border-color:var(--accent)}
.opt.on .opt-name::before{content:"✓ ";color:var(--accent)}
.opt-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.opt-name{font-weight:700}
.opt-price{font-weight:700;white-space:nowrap}
.opt-desc{font-size:13.5px;color:var(--muted);line-height:1.35}
.opt-meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;align-items:center}
.rating{font-weight:700;color:var(--sale)}
.deal,.tag{background:var(--sale-soft);color:var(--sale);border-radius:4px;padding:1px 6px;font-weight:600}
.tag{font-size:12px;text-decoration:none;margin-left:4px}
.tag.frozen{background:var(--accent-soft);color:var(--accent);margin-left:0}
.tag.est{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.snacks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.snacks label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg)}
tbody tr:last-child>*{border-bottom:0}
.r{text-align:right}
tr.total>*{font-weight:700;background:var(--accent-soft)}
.cell-sub{display:block;font-size:12.5px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.cell-sub2{font-size:13px;color:var(--muted)}
.note{color:var(--muted);font-size:14.5px;max-width:78ch;margin:8px 0}
.store{margin:14px 0}
.store h3{display:flex;justify-content:space-between;margin-bottom:6px}
.recipe{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.recipe header{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.r-meta{display:flex;gap:12px;align-items:center;font-weight:600;flex-wrap:wrap}
.r-body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px}
.recipe ul,.recipe ol{margin:0;padding-left:20px}
.recipe li{margin-bottom:5px}
.temp{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn);padding:8px 10px;border-radius:4px;font-size:14.5px}
.r-links{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.btn-link{display:inline-block;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600;padding:7px 12px;border-radius:8px;font-size:14px}
.btn-link.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.holiday{background:var(--sale-soft);border:1px solid var(--sale);border-radius:12px;padding:16px}
.holiday h2{margin-top:0}
.src{padding-left:20px;font-size:14.5px}
.chk{display:inline-block;min-width:52px;text-align:right;padding:1px 8px;border-radius:6px;font-weight:600;font-variant-numeric:tabular-nums}
.chk.ok{background:var(--good-soft);color:var(--good)}.chk.close{background:var(--warn-soft);color:var(--warn)}.chk.low{background:var(--bad-soft);color:var(--bad)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
.legend .chk{min-width:0;text-align:left}
.rules{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.rules li{display:grid;grid-template-columns:86px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rules span{display:block;color:var(--muted);font-size:14.5px}
.cite{font-weight:700;color:var(--accent) !important;font-variant-numeric:tabular-nums}
.homes{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.homes h2{margin:0}.homes .note{margin:0}
.home-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.home-row label{font-weight:600}.home-row select{width:auto;min-width:260px;max-width:100%}
.home-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.home-form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}.home-form label:last-child{grid-column:1/-1}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.print-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.print-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.print-card p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.print-btns{display:flex;gap:8px;flex-wrap:wrap}
.print-btns button,#reset,#preview-close{border:1px solid var(--accent);background:none;color:var(--accent);font-weight:600;border-radius:8px;padding:8px 12px}
.print-btns button.primary{background:var(--accent);color:var(--on-accent)}
.preview-bar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
#preview{width:100%;height:720px;border:1px solid var(--line);border-radius:8px;background:#fff}
#reset{font-size:14px;padding:6px 10px}
@media (max-width:820px){.opts,.snacks,.print-grid{grid-template-columns:1fr}.meal{grid-template-columns:1fr;gap:6px}.meal-label{padding-top:0}.r-body{grid-template-columns:1fr}.bar{position:static}.home-form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Coventry Menu Planner</h1><p id="week"></p></div>
    <div class="fresh"><span id="fresh"></span> · <button type="button" id="reset">Reset to suggested picks</button></div>
  </div>
  <div class="alert" id="alert" hidden></div>
  <div class="bar">
    <div id="sum"></div>
    <div class="sizes"><span>Residents</span><div id="sizes"><button type="button" data-n="2">2</button><button type="button" data-n="4">4</button><button type="button" data-n="6">6</button><button type="button" data-n="8">8</button><button type="button" data-n="10">10</button></div></div>
  </div>
  <nav aria-label="Sections"><button type="button" data-tab="plan">Plan the week</button><button type="button" data-tab="costs">Costs and shopping</button><button type="button" data-tab="recipes">Recipes</button><button type="button" data-tab="deals">Flyer deals</button><button type="button" data-tab="rules">Nutrition and ADHS rules</button><button type="button" data-tab="print">Print</button></nav>
  <main>
    <div id="plan"></div><div id="costs" hidden></div><div id="recipes" hidden></div><div id="deals" hidden></div><div id="rules" hidden></div><div id="print" hidden></div>
  </main>
</div>
<script>window.MENU_STANDALONE = true;</script>
<script src="week-data.js"></script>
<script src="app.js"></script>
</body>
</html>
